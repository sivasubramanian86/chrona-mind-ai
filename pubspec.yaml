name: chronamindai
description: "ChronaMindAI — EchoTwin is a revolutionary app that lets you relive your past memories with cinematic flair and simulate future choices, offering a unique blend of personal history and foresight."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  flutter_animate: ^4.0.0
  file_picker: '>=8.1.2'
  record: '>=5.1.2'
  audioplayers: ^6.0.0
  image_picker: '>=1.1.2'
  shared_preferences: ^2.0.0
  uuid: ^4.0.0
  intl: 0.20.2
  fl_chart: 0.68.0
  shimmer: ^3.0.0
  http: ^1.2.1
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: fonts/NotoSans-Italic.ttf
          style: italic
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
  assets:
    - assets/images/backgrounds/
    - assets/images/illustrations/
    - assets/images/icons/
    - assets/images/patterns/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true

